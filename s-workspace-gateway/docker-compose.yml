version: '3.8'

services:
  gateway:
    image: docker.io/tailscale/tailscale:latest
    hostname: workspaces-gateway
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_ENABLE_METRICS=true
      - TS_ACCEPT_DNS=true
      - TS_SOCKS5_SERVER=:1055
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=:1055
      - TS_TAILSCALED_EXTRA_ARGS=--port=44100
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    env_file:
      - /home/sairamsuresh/.homelab/workspace_gateway_env
    volumes:
      - tailscale_data:/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep BackendState | grep -q Running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 1055:1055/tcp
      - 1055:1055/udp
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    dns:
      - 127.0.0.1
      - 169.254.1.1
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    network_mode: "pasta"
    restart: always
  
  dns:
    build:
      context: images/dns2socks
      dockerfile: Containerfile
    environment:
      - LISTEN_ADDR=127.0.0.1:53
      - DNS_REMOTE_SERVER=100.87.51.78:53
      - SOCKS5_SETTINGS=socks5://192.168.18.9:1055
      - VERBOSITY=info
      - CACHE_RECORDS=true
      - FORCE_TCP=true
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      - gateway

volumes:
  tailscale_data: