# docker-compose.yml
version: '3.8'


services:
  tailscale:
    image: docker.io/tailscale/tailscale:latest
    hostname: homelab
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ENABLE_METRICS=true
      - TS_TAILSCALED_EXTRA_ARGS=--port=44000
      - TS_ACCEPT_DNS=true
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    env_file:
      - /home/sairamsuresh/.homelab/env
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ts_socket:/var/run/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep BackendState | grep -q Running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 44000:44000/udp
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    network_mode: "pasta"
    restart: always

  caddy:
    image: docker.io/arm64v8/caddy:alpine
    network_mode: service:tailscale
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile
      - caddy_config:/config
      - caddy_data:/data
      - ts_socket:/var/run/tailscale:z
      - step_data:/home/step:ro
    restart: unless-stopped
    depends_on:
      - tailscale
      - stepca
    cap_add:
      - NET_ADMIN
      - NET_RAW
  
  personalwebsiteadminpanel:
    image: localhost/www-admin
    restart: always
    env_file:
      - /home/sairamsuresh/.homelab/env
    environment:
      - PORT=8090
    depends_on:
      - caddy
      - tailscale
    network_mode: service:tailscale

  adguardhome:
    image: docker.io/adguard/adguardhome
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    restart: always
    depends_on:
      - caddy
    network_mode: service:tailscale
  
  voidauth: 
    image: docker.io/voidauth/voidauth:latest
    restart: unless-stopped
    environment:
      - APP_URL=https://voidauth.service.internal/
      - DB_ADAPTER=sqlite
    volumes:
      - ./configs/voidauth:/app/config
      - voidauth_db:/app/db
    env_file:
      - /home/sairamsuresh/.homelab/env
    network_mode: "service:tailscale"

  stepca:
    image: docker.io/smallstep/step-ca:latest
    restart: unless-stopped
    volumes:
      - step_data:/home/step
    environment:
      - DOCKER_STEPCA_INIT_NAME="Sairam's CA"
      - DOCKER_STEPCA_INIT_DNS_NAMES=homelab.tail4ef781.ts.net,localhost,stepca.service.internal
      - DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT=true
    network_mode: "service:tailscale"
    depends_on:
      - tailscale

  coder:
    build:
      context: /home/sairamsuresh
      dockerfile: homelab/images/coder/Containerfile
    env_file:
      - /home/sairamsuresh/.homelab/env
    environment:
      - CODER_ACCESS_URL=https://coder.service.internal
      - CODER_WILDCARD_ACCESS_URL=*.coder.service.internal
      - CODER_HTTP_ADDRESS=0.0.0.0:7080
#      - LIBVIRT_DEFAULT_URI=qemu:///session?socket=/run/user/1000/libvirt/virtqemud-sock
      - CODER_OIDC_ISSUER_URL=https://voidauth.service.internal/oidc
      - CODER_DISABLE_PASSWORD_AUTH=true
    volumes:
      - coder_home:/home/coder:Z
    group_add:
      - "keep-groups"
    restart: always
    depends_on:
      coder_database:
        condition: service_healthy
    user: "1000:1000" 
    expose:
      - 7080
      - 5432
    network_mode: "service:tailscale"

  coder_database:
    image: "postgres:16"
    env_file:
      - /home/sairamsuresh/.homelab/env
    volumes:
      - coder_data:/var/lib/postgresql/data:Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-username} -d ${POSTGRES_DB:-coder}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    expose:
      - 5432
    network_mode: "service:tailscale"

volumes:
  adguard_work:
  adguard_conf:
  tailscale_data:
  caddy_data:
  caddy_config:
  ts_socket:
  voidauth_db:
  step_data:
  coder_data:
  coder_home:

