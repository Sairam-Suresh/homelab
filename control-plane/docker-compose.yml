version: '3.8'

services:
  tailscale:
    image: docker.io/tailscale/tailscale:latest
    hostname: homelab
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ENABLE_METRICS=true
      - TS_TAILSCALED_EXTRA_ARGS=--port=44000
      - TS_ACCEPT_DNS=true
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    env_file:
      - /opt/serve/.homelab/env
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ts_socket:/var/run/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep BackendState | grep -q Running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 44000:44000/udp
      - 1080:1080
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    network_mode: "pasta"
    restart: always

  caddy:
    image: docker.io/arm64v8/caddy:alpine
    network_mode: service:tailscale
    env_file:
      - /opt/serve/.homelab/env
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile
      - caddy_config:/config
      - caddy_data:/data
      - ts_socket:/var/run/tailscale:z
      - step_data:/home/step:ro
      - caddy_socket:/var/run/caddy:z
    restart: unless-stopped
    depends_on:
      - tailscale
      - stepca
    cap_add:
      - NET_ADMIN
      - NET_RAW

  sparkplug:
    image: ghcr.io/sairam-suresh/sparkplug:latest
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - /opt/serve/.homelab/env
    environment:
      - SPARKPLUG_CONFIG_PATH=/etc/sparkplug/config.yaml
    volumes:
      - /opt/serve/.sparkplug/config.yaml:/etc/sparkplug/config.yaml:ro
      - /opt/serve/.sparkplug/keys:/etc/sparkplug/keys
      - caddy_socket:/var/run/caddy:z
    depends_on:
      - tailscale
      - caddy
  
  personalwebsiteadminpanel:
    image: localhost/www-admin
    restart: always
    env_file:
      - /opt/serve/.homelab/env
    environment:
      - PORT=8090
    depends_on:
      - caddy
      - tailscale
    network_mode: service:tailscale

  adguardhome:
    image: docker.io/adguard/adguardhome
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    restart: always
    depends_on:
      - caddy
    network_mode: service:tailscale
  
  voidauth: 
    image: docker.io/voidauth/voidauth:latest
    restart: unless-stopped
    environment:
      - APP_URL=https://voidauth.service.internal/
      - DB_ADAPTER=sqlite
    volumes:
      - ./configs/voidauth:/app/config
      - voidauth_db:/app/db
    env_file:
      - /opt/serve/.homelab/env
    network_mode: "service:tailscale"

  stepca:
    image: docker.io/smallstep/step-ca:latest
    restart: unless-stopped
    volumes:
      - step_data:/home/step
    environment:
      - DOCKER_STEPCA_INIT_NAME="Sairam's CA"
      - DOCKER_STEPCA_INIT_DNS_NAMES=homelab.tail4ef781.ts.net,localhost,stepca.service.internal
      - DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT=true
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
  
  external_service_proxy:
    image: docker.io/serjs/go-socks5-proxy
    network_mode: service:tailscale
    env_file:
      - /opt/serve/.homelab/env
    restart: always

  homelab_updater:
    image: ghcr.io/sairam-suresh/homelab-update-service:latest
    restart: unless-stopped
    env_file:
      - /opt/serve/.homelab/env
    environment:
      - PORT=7777
      - DEVICES_CONFIG_PATH=/etc/homelab-updater/devices.yaml
      - ALLOWED_SIGNERS_PATH=/etc/homelab-updater/allowed_signers
      - REQUIRE_COMMIT_SIGNATURE=true
    volumes:
      - /opt/serve/.homelab_updater/devices.yaml:/etc/homelab-updater/devices.yaml:ro
      - /opt/serve/.homelab_updater/allowed_signers:/etc/homelab-updater/allowed_signers:ro
      - /opt/serve/.homelab_updater/keys:/etc/homelab-updater/keys:ro
    network_mode: service:tailscale
    depends_on:
      - tailscale

  arkeep:
    image: ghcr.io/arkeep-io/arkeep-server:latest
    restart: unless-stopped
    env_file:
      - /opt/serve/.homelab/env
    environment:
      - ARKEEP_HTTP_ADDR=:8081
      - ARKEEP_GRPC_ADDR=:9090
      - ARKEEP_BASE_URL=https://arkeep.service.internal
      - ARKEEP_DATA_DIR=/var/lib/arkeep/data
      - ARKEEP_DB_DRIVER=sqlite
      - ARKEEP_DB_DSN=/var/lib/arkeep/arkeep.db
    volumes:
      - arkeep_data:/var/lib/arkeep
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - caddy

volumes:
  adguard_work:
  adguard_conf:
  tailscale_data:
  caddy_data:
  caddy_config:
  ts_socket:
  voidauth_db:
  step_data:
  caddy_socket:
  arkeep_data: